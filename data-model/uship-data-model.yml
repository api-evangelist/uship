- {from: Listing, to: Route, kind: has_one, via: route}
- {from: Listing, to: ListingItem, kind: has_many, via: items}
- {from: Listing, to: Bid, kind: has_many, via: '/v2/listings/{listingId}/bids'}
- {from: Listing, to: TransitStatus, kind: has_many, via: '/v2/listings/{listingId}/transitStatuses'}
- {from: Listing, to: Conversation, kind: has_many, via: listing conversations}
- {from: Listing, to: Feedback, kind: has_many, via: listings feedback}
- {from: Listing, to: Commodity, kind: belongs_to, via: commodities}
- {from: Bid, to: ServiceProvider, kind: belongs_to, via: bidder}
- {from: Bid, to: Pricing, kind: has_one, via: pricing}
- {from: Booking, to: Bid, kind: belongs_to, via: winning bid}
- {from: Booking, to: AssignedDriver, kind: has_one, via: assignedDriver}
- {from: RateRequest, to: Route, kind: has_one, via: route}
- {from: RateRequest, to: ListingItem, kind: has_many, via: items}
- {from: RateRequest, to: Lister, kind: belongs_to, via: lister}
