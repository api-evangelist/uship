- {from: Listing, to: ServiceType, kind: references, via: serviceTypes}
enumerations:
  transit_status: [ReadyForDispatch, Dispatched, PickedUp, Delivered]
  punctuality: [OnTime, NotApplicable]
  pricing_format: [Auction]
  pricing_format_note: >-
    Auction is the value documented verbatim in the Search reference; published rates are the second
    pricing model but its enumeration value is not published outside the gated portal.
  reference: https://developer.uship.com/about-our-apis/uship-api-reference-enumerations
notes:
- >-
  Entity and relationship names come from uShip's own object reference. Path shapes are the ones uShip
  documents verbatim; no operationIds are asserted because no OpenAPI is published.
