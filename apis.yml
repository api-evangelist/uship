- name: uShip Published Rates API
  description: >-
    Bookable, algorithmically priced rates published by service providers in response to shipping-customer rate
    requests, as an alternative to the auction/bidding flow. Covers the shipping-customer side (create a rate
    request, create an LTL rate request, retrieve rates, accept a rate) and the service-provider side (setup,
    rate request notification, create rate, booking acceptance notification), including the HTTP callback
    notifications uShip POSTs to a provider's recipient URL.
  humanURL: https://developer.uship.com/docs/read/apis/published_rates
  baseURL: https://api.uship.com/v2
  tags:
  - Freight
  - rate-quotes
