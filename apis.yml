aid: uship
name: uShip
description: >-
  uShip is an online shipping marketplace, founded in 2004 and headquartered in Austin, Texas, that connects
  individuals and businesses with a network of professional transport service providers to move large, heavy, and
  oversized freight — cars and light trucks, motorcycles and powersports, boats, furniture and household goods,
  heavy equipment, livestock, and LTL freight. Shippers list a shipment for free and carriers compete with bids or
  bookable published rates, giving shippers pricing transparency and choice. uShip exposes the marketplace to
  partners, affiliates, brokers, carriers, and eCommerce platforms through the uShip API (v2), a RESTful,
  hypermedia-driven JSON API secured with OAuth 2.0 covering shipment search, listing creation by commodity
  category, bidding, published/LTL rate requests and rate acceptance, booking, tracking and transit statuses,
  lookups, and integrator user management. API access is partner-gated — the developer portal at
  developer.uship.com is invitation-only and access is granted by the uShip API team.
