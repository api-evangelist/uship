apis:
- name: uShip API v2
  description: >-
    The core uShip marketplace API — a RESTful, hypermedia-driven JSON API over the shipment lifecycle: searching
    active listings, creating and retrieving listings by commodity category, bids and bid acceptance, booking,
    contacts and conversations, feedback, payment codes, listing and transit statuses, tracking history, user
    profile, and lookup collections (commodities, address types, regions, currencies, service types, trailer
    types, vehicle year/make/model). Secured with OAuth 2.0; responses carry a links[] hypermedia array with
    rel/verb/href/title so clients discover permitted next actions instead of hard-coding URIs.
  humanURL: https://developer.uship.com/docs
  baseURL: https://api.uship.com/v2
